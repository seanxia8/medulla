[[tree]]
name = "selected"
sim_only = false
add_systematics = true
mode = "reco"
cut = [
    {name = "!valid_flashmatch", type = "reco"},
    {name = "size_cut", type = "reco_particle", parameters = [7,]},
    {name = "michel_in_range", type= "reco", parameters = [8.7,]},
    {name = "is_semantic_type", type = "reco_particle", parameters = [2.0,]},
]
branch = [
    {name = "neutrino_id",  type = "true"},
    {name = "semantic_type", type = "both_particle"},
    {name = "iou", type = "both_particle"},
    {name = "ke", type = "both_particle"},
    {name = "calo_ke", type = "reco_particle"},
]

[[tree]]
name = "signal"
sim_only = false
mode = "reco"
cut = [
    {name = "!valid_flashmatch", type = "reco"},
    {name = "size_cut", type = "true_particle", parameters = [7,]},
    {name = "michel_in_range", type= "true", parameters = [8.7,]},
    {name = "is_semantic_type", type = "true_particle", parameters = [2.0,]},
]
branch = [
    {name = "neutrino_id",  type = "true"},
    {name = "semantic_type", type = "both_particle"},
    {name = "iou", type = "both_particle"},
    {name = "ke", type = "both_particle"},
    {name = "calo_ke", type = "reco_particle"},
]