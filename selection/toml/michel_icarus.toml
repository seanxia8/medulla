[general]
output = "output"
pidfn = "default_pid"
primfn = "default_primary_classification"

[[category]] # 0 : Cosmic mu- to e-
cuts = [
    { name = "!neutrino" },
    { name = "is_semantic_type",  type='true_particle', parameters = [2.0,] },
    { name = "is_pdg_code",       type='true_particle', parameters = [11,]  },
]

[[category]] # 1 : Cosmic mu- to e-
cuts = [
    { name = "!neutrino" },
    { name = "is_semantic_type",  type='true_particle', parameters = [2.0,] },
    { name = "is_pdg_code",       type='true_particle', parameters = [-11,] },
]

[[category]] # 2 : gamma
cuts = [
    { name = "is_pdg_code",       type='true_particle', parameters = [22,]  },
]

[[category]] # 3 : others
cuts = [
    { name = "!neutrino",         parameters = [22,]  },
    { name = "!is_semantic_type", type='true_particle', parameters = [2.0,] },
    { name = "!is_pdg_code",      type='true_particle', parameters = [11,]  },
    { name = "!is_pdg_code",      type='true_particle', parameters = [-11,] },
    { name = "!is_pdg_code",      type='true_particle', parameters = [22,]  },
]

