[general]
output = "output"
pidfn = "default_pid"
primfn = "default_primary_classification"

[[category]] # 0 : Cosmic mu- to e-
cuts = [
    { name = "!neutrino" },
    { name = "is_michel_pdg", parameter = [11.0, 8.7] },
]

[[category]] # 1 : Cosmic mu- to e-
cuts = [
    { name = "!neutrino" },
    { name = "is_michel_pdg", parameters = [-11.0, 8.7] },
]

[[category]] # 2 : offbeam gamma
cuts = [
    { name = "!neutrino" },
    { name = "is_michel_pdg",   parameters = [22.0, 8.7]  },
]

[[category]] # 3 : other cosmics
cuts = [
    { name = "!neutrino" },
    { name = "!is_michel_pdg",  parameters = [11.0, 8.7]  },
    { name = "!is_michel_pdg",  parameters = [-11.0, 8.7] },
    { name = "!is_michel_pdg",  parameters = [22.0, 8.7]  },
]

[[category]] # 4 : beam
cuts = [
    { name = "neutrino" },
]

[[sample]]
name = "onbeam"
path = "/pnfs/icarus/persistent/users/mueller/production/data/onbeam/input*.flat.root"
ismc = false
disable = false

