[[tree]]
name = "selected"
sim_only = false
add_systematics = true
mode = "reco"
cut = [
    {name = "!valid_flashmatch", type = "reco"},
    {name = "michel_in_range",   type = "reco", parameters = [8.7]},
    {name = "michel_size",       type = "reco", parameters = [7.0, 8.7]},
]
branch = [
    {name = "neutrino_id",   type = "true"},
    {name = "semantic_type", type = "both_particle", selector = "target_michel"},
    {name = "iou",           type = "both_particle", selector = "target_michel"},
    {name = "ke",            type = "both_particle", selector = "target_michel"},
    {name = "calo_ke",       type = "reco_particle", selector = "target_michel"},
]

[[tree]]
name = "signal"
sim_only = false
mode = "reco"
cut = [
    {name = "!valid_flashmatch", type = "reco"},
    {name = "michel_in_range",   type = "true", parameters = [8.7]},
    {name = "michel_size",       type = "true", parameters = [7.0, 8.7]},
]
branch = [
    {name = "neutrino_id",   type = "true"},
    {name = "semantic_type", type = "both_particle", selector = "target_michel"},
    {name = "iou",           type = "both_particle", selector = "target_michel"},
    {name = "ke",            type = "both_particle", selector = "target_michel"},
    {name = "calo_ke",       type = "reco_particle", selector = "target_michel"},
]