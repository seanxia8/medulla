[general]
output = "icarus_nue_cosmic_2025_mc"
primfn = "default_primary_classification"
pidfn = "default_pid"

[[category]] # 0: nue 1eNp
cuts = [
    { name = "is_nue"                             },
    { name = "topological_1eNp_cut"               },
]

[[category]] # 1: neutrino, nue CC
cuts = [
    {name =  "is_nue"                             },
    { name = "!topological_1eNp_cut"              },
    {name =  "iscc"                               },
]

[[category]] # 2: neutrino, nue NC
cuts = [
    {name =  "is_nue"                             },
    { name = "!topological_1eNp_cut"              },
    {name =  "!iscc"                              },
]

[[category]] # 3: neutrino, numu CC
cuts = [
    {name =  "is_numu"                             },
    {name =  "iscc"                               },
]

[[category]] # 4: neutrino, numu NC
cuts = [
    {name =  "is_numu"                             },
    {name =  "!iscc"                              },
]

[[sample]]
name = "onbeam"
path = "/pnfs/icarus/persistent/users/mueller/mixed/data/onbeam/input*.flat.root"
ismc = false
disable = true

