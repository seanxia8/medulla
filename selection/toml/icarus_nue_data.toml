[general]
output = "/exp/icarus/app/users/jxia/medulla/root_output/icarus_nue_2025_data_selected"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold = 25.0
electron_threshold = 50.0
muon_threshold = 143.425
pion_threshold = 25.0
proton_threshold = 50.0
flash_low_t = -0.5
flash_high_t = 1.6
bnb_fom2_cut = 0.98

[[sample]]
name = "onbeam"
path = "/pnfs/icarus/persistent/users/mueller/production/data/onbeam/input*.flat.root"
ismc = false
disable = false

[[sample]]
name = "offbeam"
path = "/pnfs/icarus/persistent/users/mueller/production/data/offbeam/input*.flat.root"
ismc = false
disable = false


[[tree]]
name = "selectedNu"
sim_only = false
add_exposure = true
mode = "reco"
cut = [
    { name = "all_1eNp_cut",              type = "reco" },
    { name = "all_shower_cut",            type = "reco" },
    { name = "trigger_emulation_cut",     type = "event", decrements_exposure = false },
    { name = "data_quality_cut",          type = "event", decrements_exposure = true },
    { name = "beam_quality_cut",          type = "spill", decrements_exposure = false }, # Should decrement exposure, but CAF files are bugged
    { name = "bnb_fom2_cut",              type = "event", decrements_exposure = false, parameters = [0.98,]}, # Should decrement exposure, but CAF files are bugged
]
branch = [
    # Interaction-level truth/reco branches
    { name = "containment",             type = "reco"    },
    { name = "fiducial",                type = "reco"    },
    { name = "visible_energy",          type = "reco"    },
    { name = "visible_energy_calosub",  type = "reco"    },
    { name = "photon_multiplicity",     type = "reco",    parameters = [25.0,]},
    { name = "electron_multiplicity",   type = "reco",    parameters = [50.0,]},
    { name = "muon_multiplicity",       type = "reco",    parameters = [143.425,]},
    { name = "pion_multiplicity",       type = "reco",    parameters = [25.0,]},
    { name = "proton_multiplicity",     type = "reco",    parameters = [50.0,]},

    # Kinematic imbalance & angles
    { name = "opening_angle", type = "reco" , parameters = [1]}, # -1 for muon, 1 for electron
    { name = "dpT",           type = "reco" },
    { name = "dpT_lp",        type = "reco" },
    { name = "dphiT",         type = "reco" },
    { name = "dalphaT",       type = "reco" },
    { name = "dpL",           type = "reco" },
    { name = "dpL_lp",        type = "reco" },
    { name = "pn",            type = "reco" },
    { name = "pn_lp",         type = "reco" },

    # Vertex & flash
    { name = "vertex_x",         type = "reco" },
    { name = "vertex_y",         type = "reco" },
    { name = "vertex_z",         type = "reco" },
    { name = "flash_time",       type = "reco" },
    { name = "flash_total_pe",   type = "reco" },
    { name = "flash_hypothesis", type = "reco" },

    # Leading electron interaction-level
    #{ name = "end_x",             type = "reco_particle", selector = "leading_electron"   },
    #{ name = "end_y",             type = "reco_particle", selector = "leading_electron"   },
    #{ name = "end_z",             type = "reco_particle", selector = "leading_electron"   },
    { name = "ke",                type = "reco_particle", selector = "leading_electron"   },
    #{ name = "length",            type = "reco_particle", selector = "leading_electron"   },
    { name = "dpT",               type = "reco_particle", selector = "leading_electron"   },
    { name = "polar_angle",       type = "reco_particle", selector = "leading_electron"   },
    { name = "azimuthal_angle",   type = "reco_particle", selector = "leading_electron"   },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_electron"   },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_electron"   },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_electron"   },

    # Leading PROTON interaction-level
    { name = "end_x",             type = "reco_particle", selector = "leading_proton" },
    { name = "end_y",             type = "reco_particle", selector = "leading_proton" },
    { name = "end_z",             type = "reco_particle", selector = "leading_proton" },
    { name = "ke",                type = "reco_particle", selector = "leading_proton" },
    { name = "length",            type = "reco_particle", selector = "leading_proton" },
    { name = "dpT",               type = "reco_particle", selector = "leading_proton" },
    { name = "polar_angle",       type = "reco_particle", selector = "leading_proton" },
    { name = "azimuthal_angle",   type = "reco_particle", selector = "leading_proton" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_proton" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_proton" },
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_proton" },
    { name = "mip_softmax",       type = "reco_particle", selector = "leading_proton" },
    { name = "hadron_softmax",    type = "reco_particle", selector = "leading_proton" },

    # Leading electron interaction-level
    { name = "leading_shower_start_dedx",        type = "reco_particle", selector = "leading_primary_shower"   },
    { name = "leading_shower_vertex_distance",   type = "reco_particle", selector = "leading_primary_shower"   },
    { name = "leading_shower_directional_spread",type = "reco_particle", selector = "leading_primary_shower"   },
    { name = "leading_shower_axial_spread",      type = "reco_particle", selector = "leading_primary_shower"   },
    { name = "leading_shower_start_straightness",type = "reco_particle", selector = "leading_primary_shower"   },
]