[general]
output = "output"

primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold = 25.0
electron_threshold = 50.0
muon_threshold = 25.0 #143.425
pion_threshold = 25.0
proton_threshold = 50.0
flash_low_t = -0.5
flash_high_t = 1.6
bnb_fom2_cut = 0.98

[[category]] # 0: nue 1eNp
cuts = [
    { name = "signal_1eNp"               },
]

[[category]] # 1: neutrino, nue CC
cuts = [
    { name = "is_nue"                             },
    { name = "!signal_1eNp"                       },
    { name = "iscc"                               },
]

[[category]] # 2: neutrino, nue NC
cuts = [
    { name = "is_nue"                             },
    { name = "!signal_1eNp"               },
    { name = "!iscc"                              },
]

[[category]] # 3: neutrino, numu CC
cuts = [
    { name = "is_numu"                             },
    { name = "iscc"                                },
]

[[category]] # 4: neutrino, numu NC
cuts = [
    { name = "is_numu"                             },
    { name = "!iscc"                               },
]

[[category]] # 5 : Cosmic
cuts = [
    { name = "!neutrino" },
]

[[category]] # 6: Others
cuts = [
    { name = "neutrino" },
    { name = "non_signal_1eNp" },
    { name = "!is_nue" },
    { name = "!is_numu" },
]

[[sample]]
name = "onbeam"
path = "/pnfs/icarus/persistent/users/mueller/production/data/onbeam/input*.flat.root"
ismc = false
disable = false

[[sample]]
name = "offbeam"
path = "/pnfs/icarus/persistent/users/mueller/production/data/offbeam/input*.flat.root"
ismc = false
disable = false

[[sample]]
name = "nominal"
path = "/pnfs/icarus/persistent/users/mueller/production/simulation/nominal/input*.flat.root"
ismc = true
disable = false

[[sample]]
name = "cvext"
path = "/pnfs/icarus/persistent/users/mueller/production/simulation/cvext/input*.flat.root"
ismc = true
disable = false

[[tree]]
name = "selectedNu"
sim_only = false
add_exposure = true
add_systematics = true
mode = "reco"
cut = [
    { name = "all_1eNp_cut",              type = "reco" },
    #{ name = "all_shower_cut",            type = "reco" },
    { name = "flash_cut",                 type = "reco", parameters = ["@flash_low_t", "@flash_high_t"] },
    { name = "no_photons",                type = "reco", parameters = ["@photon_threshold"] },
    { name = "no_muons",                  type = "reco", parameters = ["@muon_threshold"] },
    { name = "no_charged_pions",          type = "reco", parameters = ["@pion_threshold"] },
    { name = "!no_protons",               type = "reco", parameters = ["@proton_threshold"] },
    { name = "single_electron",           type = "reco", parameters = ["@electron_threshold"] },
    { name = "trigger_emulation_cut",     type = "event", decrements_exposure = true },
    { name = "data_quality_cut",          type = "event", decrements_exposure = true },
    { name = "beam_quality_cut",          type = "spill", decrements_exposure = true }, # Should decrement exposure, but CAF files are bugged
    #{ name = "bnb_fom2_cut",              type = "event", decrements_exposure = true, parameters = ["@bnb_fom2_cut"]}, # Should decrement exposure, but CAF files are bugged
]

branch = [
    # Interaction-level truth/reco branches
    #{ name = "bnb_fom2",                type = "event" },
    { name = "neutrino_id",             type = "true"    },
    { name = "containment",             type = "both"    },
    { name = "fiducial",                type = "both"    },
    { name = "baseline",                type = "mctruth" },
    { name = "cc",                      type = "mctruth" },
    { name = "pdg",                     type = "mctruth" },
    { name = "interaction_mode",        type = "mctruth" },
    { name = "interaction_type",        type = "mctruth" },
    { name = "category",                type = "true"    },
    { name = "neutrino_energy",         type = "mctruth" },
    { name = "visible_energy",          type = "both"    },
    { name = "visible_energy_calosub",  type = "both"    },
    { name = "photon_multiplicity",     type = "both",    parameters = ["@photon_threshold"]},
    { name = "electron_multiplicity",   type = "both",    parameters = ["@electron_threshold"]},
    { name = "muon_multiplicity",       type = "both",    parameters = ["@muon_threshold"]},
    { name = "pion_multiplicity",       type = "both",    parameters = ["@pion_threshold"]},
    { name = "proton_multiplicity",     type = "both",    parameters = ["@proton_threshold"]},

    # Kinematic imbalance & angles
    { name = "opening_angle", type = "both" , parameters = [1]}, # -1 for muon, 1 for electron
    { name = "dpT",           type = "both" },
    { name = "dpT_lp",        type = "both" },
    { name = "dphiT",         type = "both" },
    { name = "dalphaT",       type = "both" },
    { name = "dpL",           type = "both" },
    { name = "dpL_lp",        type = "both" },
    { name = "pn",            type = "both" },
    { name = "pn_lp",         type = "both" },

    # Vertex & flash
    { name = "vertex_x",         type = "both" },
    { name = "vertex_y",         type = "both" },
    { name = "vertex_z",         type = "both" },
    { name = "flash_time",       type = "reco" },
    { name = "flash_total_pe",   type = "reco" },
    { name = "flash_hypothesis", type = "reco" },
    { name = "leading_shower_vertex_gap", type="both"},

    # Leading electron interaction-level
    #{ name = "end_x",             type = "both_particle", selector = "leading_electron"   },
    #{ name = "end_y",             type = "both_particle", selector = "leading_electron"   },
    #{ name = "end_z",             type = "both_particle", selector = "leading_electron"   },
    { name = "ke",                type = "both_particle", selector = "leading_electron"   },
    #{ name = "length",            type = "both_particle", selector = "leading_electron"   },
    { name = "dpT",               type = "both_particle", selector = "leading_electron"   },
    { name = "polar_angle",       type = "both_particle", selector = "leading_electron"   },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_electron"   },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_electron"   },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_electron"   },
    { name = "electron_softmax",  type = "reco_particle", selector = "leading_electron"   },

    # Leading PROTON interaction-level
    { name = "end_x",             type = "both_particle", selector = "leading_proton" },
    { name = "end_y",             type = "both_particle", selector = "leading_proton" },
    { name = "end_z",             type = "both_particle", selector = "leading_proton" },
    { name = "ke",                type = "both_particle", selector = "leading_proton" },
    { name = "length",            type = "both_particle", selector = "leading_proton" },
    { name = "dpT",               type = "both_particle", selector = "leading_proton" },
    { name = "polar_angle",       type = "both_particle", selector = "leading_proton" },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_proton" },
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_proton" },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_proton" },
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_proton" },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_proton" },
    { name = "mip_softmax",       type = "reco_particle", selector = "leading_proton" },
    { name = "hadron_softmax",    type = "reco_particle", selector = "leading_proton" },

    # Leading electron interaction-level
    { name = "start_dedx",        type = "reco_particle", selector = "leading_primary_shower"   },
    { name = "vertex_distance",   type = "reco_particle", selector = "leading_primary_shower"   },
    { name = "directional_spread",type = "reco_particle", selector = "leading_primary_shower"   },
    { name = "axial_spread",      type = "reco_particle", selector = "leading_primary_shower"   },
    { name = "start_straightness",type = "reco_particle", selector = "leading_primary_shower"   },
]

