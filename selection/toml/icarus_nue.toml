[general]
output = "icarus_nue_example"
primfn = "default_primary_classification"
pidfn = "default_pid"

[[category]] # 0: Contained, fiducial, single electron, N proton
cuts = [
    { name = "neutrino"                            },
    { name = "fiducial_cut"                        },
    { name = "containment_cut"                     },
    { name = "single_electron", parameters = [50.0]},
    { name = "!no_protons",     parameters = [50.0]},
]

[[category]] # 1: Contained, fiducial, single muon, CC
cuts = [
    {name =  "neutrino"                            },
    {name =  "fiducial_cut"                        },
    {name =  "containment_cut"                     },
    {name =  "single_muon",  parameters = [143.425]},
    {name =  "iscc"                                },
]

[[category]] # 2: Contained, fiducial, single muon, NC
cuts = [
    {name =  "neutrino"                            },
    {name =  "fiducial_cut"                        },
    {name =  "containment_cut"                     },
    {name =  "single_muon",  parameters = [143.425]},
    {name =  "!iscc"                               },
]

[[category]] # 3: Contained, fiducial, single electron, CC
cuts = [
    {name =  "neutrino"                            },
    {name =  "fiducial_cut"                        },
    {name =  "containment_cut"                     },
    {name =  "single_electron", parameters = [50.0]},
    {name =  "iscc"                                },
]

[[category]] # 4: Contained, fiducial, single electron, NC
cuts = [
    {name =  "neutrino"                            },
    {name =  "fiducial_cut"                        },
    {name =  "containment_cut"                     },
    {name =  "single_electron", parameters = [50.0]},
    {name =  "!iscc"                               },
]

[[category]] # 5: Cosmic
cuts = [
    {name = "!neutrino"},
]

[[category]] # 0: Contained, fiducial, single electron, N proton, optimized
cuts = [
    { name = "neutrino"                            },
    { name = "fiducial_cut"                        },
    { name = "containment_cut"                     },
    { name = "single_electron", parameters = [50.0]},
    { name = "!no_protons",     parameters = [50.0]},
    { name = "all_shower_cut"                      },
]

[[sample]]
name = "offbeam"
path = "/pnfs/icarus/persistent/users/mueller/mixed/data/offbeam/input000.flat.root"
ismc = true
disable = false

